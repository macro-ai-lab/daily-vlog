name: Installation matrix
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the contract and build one shared candidate ZIP
        run: |
          python -B _maintenance/skill-distribution/scripts/distribute.py check --repo .
          python -B _maintenance/skill-distribution/scripts/distribute.py package --repo . --output install-test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: install-package
          path: install-test.zip
          if-no-files-found: error
  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        client: [codex, claude-code]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: install-package
      - name: Check archive bytes and test the same ZIP on the native OS
        shell: bash
        run: |
          python -B _maintenance/skill-distribution/scripts/distribute.py check --repo . --archive install-test.zip
          python -B _maintenance/skill-distribution/scripts/smoke_matrix.py --archive install-test.zip --client "${{ matrix.client }}" --report install-result.json --work-directory install-work
      - name: Test installed optional frame preview, fonts and MP4 agreement
        shell: bash
        env:
          TEST_CLIENT: ${{ matrix.client }}
        run: |
          python - <<'PYTEST'
          import os, pathlib, subprocess
          work = pathlib.Path('install-work').resolve()
          project = work / 'project 작업 폴더'
          runtime = project / '.daily-vlog-runtime/v1/venv'
          python = runtime / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          folder = '.claude' if os.environ['TEST_CLIENT'] == 'claude-code' else '.agents'
          skill = project / folder / 'skills/daily-vlog'
          env = dict(os.environ, DAILY_VLOG_TEST_SKILL=str(skill))
          subprocess.run([str(python), '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_daily_vlog_storyboard.py', '-v'], env=env, check=True)
          PYTEST
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-${{ matrix.os }}-${{ matrix.client }}
          path: install-result.json
          if-no-files-found: warn
